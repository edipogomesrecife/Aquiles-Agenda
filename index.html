<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AURA OS - Agenda Integrada</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Layout Principal */
    #app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    /* Painel de Controle e Agenda */
    #agenda-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      overflow-y: auto;
      border-right: 1px solid var(--border);
    }

    /* Painel do Chat do Aquiles */
    #chat-panel {
      width: 380px;
      display: flex;
      flex-direction: column;
      background-color: var(--card-bg);
      border-left: 1px solid var(--border);
    }

    .chat-header {
      padding: 15px 20px;
      border-bottom: 1px solid var(--border);
      font-weight: bold;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #chat-messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chat-msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .chat-msg.user {
      align-self: flex-end;
      background-color: var(--accent);
      color: #fff;
      border-bottom-right-radius: 2px;
    }

    .chat-msg.aquiles {
      align-self: flex-start;
      background-color: var(--bg-color);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 2px;
    }

    .chat-input-area {
      padding: 15px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }

    .chat-input-area input {
      flex: 1;
      background: var(--bg-color);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      outline: none;
    }

    .chat-input-area button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .chat-input-area button:hover {
      background: var(--accent-hover);
    }

    /* Elementos da Agenda */
    header {
      margin-bottom: 20px;
    }

    .timeline-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <!-- Painel Esquerdo: Agenda -->
    <main id="agenda-panel">
      <header>
        <h1>AURA OS</h1>
        <p id="current-date-display"></p>
      </header>

      <section class="timeline-container">
        <h3>Grade de Horários / Tarefas</h3>
        <div id="timeline-grid"></div>
        <div id="backlog"></div>
      </section>
    </main>

    <!-- Painel Direito: Chat do Aquiles -->
    <aside id="chat-panel">
      <div class="chat-header">
        <span>🤖</span>
        <span>Aquiles IA</span>
      </div>
      
      <div id="chat-messages">
        <div class="chat-msg aquiles">
          Olá! Sou o Aquiles. Como posso ajudar com sua rotina hoje?
        </div>
      </div>

      <form class="chat-input-area" id="chat-form">
        <input type="text" id="chat-input" placeholder="Digite uma mensagem ou comando..." required autocomplete="off" />
        <button type="submit">Enviar</button>
      </form>
    </aside>
  </div>

  <script>
    // ESTADO E VARIÁVEIS GLOBAIS
    const currentDate = new Date();
    const aquilesHistory = []; // Histórico da conversa em memória
    
    // Elementos DOM
    const chatMessages = document.getElementById('chat-messages');
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const timelineGrid = document.getElementById('timeline-grid');
    const backlog = document.getElementById('backlog');
    const currentDateDisplay = document.getElementById('current-date-display');

    // Inicialização da Tela
    currentDateDisplay.textContent = currentDate.toLocaleDateString('pt-BR', { 
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
    });

    // --- FUNÇÕES DE INTERAÇÃO COM O AQUILES ---

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const userText = chatInput.value.trim();
      if (userText) {
        handleAquilesQuery(userText);
      }
    });

    function appendMessage(sender, text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `chat-msg ${sender}`;
      msgDiv.textContent = text;
      chatMessages.appendChild(msgDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function handleAquilesQuery(userText) {
      appendMessage('user', userText);
      chatInput.value = '';

      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'chat-msg aquiles';
      loadingDiv.textContent = 'Aquiles está pensando...';
      chatMessages.appendChild(loadingDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;

      const tarefasContexto = await getAllDecryptedTasksForAquiles();
      const hojeYMD = getDateKey();

      try {
        const response = await fetch('https://aquiles-agenda.onrender.com/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            message: userText,
            history: aquilesHistory,
            context: {
              current_date: hojeYMD,
              tasks: tarefasContexto
            }
          })
        });

        if (!response.ok) {
          throw new Error(`Erro no servidor: ${response.status}`);
        }

        const data = await response.json();
        loadingDiv.remove();

        const respostaIA = typeof data === 'string' ? data : (data.reply || JSON.stringify(data));
        
        // Adiciona ao histórico local o formato padronizado do SDK do Gemini
        aquilesHistory.push({ role: 'user', parts: userText });
        aquilesHistory.push({ role: 'model', parts: respostaIA });

        // Se o Python indicar a intenção de criar uma tarefa
        if (data.action === "CREATE_TASK") {
          const newId = 'task_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
          const newTaskObj = {
            id: newId,
            title: data.title || 'Nova Tarefa',
            start: normalizeTimeString(data.start || ''),
            end: normalizeTimeString(data.end || ''),
            notes: data.notes || '',
            done: false,
            dateKey: getDateKey()
          };

          await saveTaskToDB(newTaskObj);

          const taskEl = createTaskDOM(newTaskObj);
          if (taskEl) {
            if (newTaskObj.start) timelineGrid.appendChild(taskEl);
            else backlog.appendChild(taskEl);
          }
        }

        appendMessage('aquiles', respostaIA);

      } catch (err) {
        console.error(err);
        loadingDiv.remove();
        appendMessage('aquiles', 'Não foi possível se conectar ao servidor Python. Certifique-se de que ele está ativo!');
      }
    }

    // --- FUNÇÕES AUXILIARES DA AGENDA / BANCO ---

    function getDateKey() {
      return `${currentDate.getFullYear()}-${String(currentDate.getMonth()+1).padStart(2,'0')}-${String(currentDate.getDate()).padStart(2,'0')}`;
    }

    function normalizeTimeString(timeStr) {
      if (!timeStr) return '';
      return timeStr.trim();
    }

    async function getAllDecryptedTasksForAquiles() {
      // Simulação / Exemplo de retorno de tarefas ativas
      return [
        { title: 'Reunião de Alinhamento', start: '09:00', end: '10:00' }
      ];
    }

    async function saveTaskToDB(taskObj) {
      console.log('Tarefa salva com sucesso:', taskObj);
    }

    function createTaskDOM(taskObj) {
      const card = document.createElement('div');
      card.className = 'task-card';
      const timeText = taskObj.start ? `[${taskObj.start} - ${taskObj.end || '?'}] ` : '[Sem horário] ';
      card.textContent = `${timeText}${taskObj.title}`;
      return card;
    }
  </script>
</body>
</html>
